<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VKU Field Survey PWA - Offline-first campus facility inspection form.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VKU Survey">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <meta name="theme-color" content="#C0392B">

  <title>VKU Field Survey PWA</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { height: 100%; background: #FAF6EE; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-family: sans-serif;
      color: #1F3A93; background: #FAF6EE;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div>Đang tải VKU Field Survey…</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js')
          .then(function (reg) {
            console.log('Service Worker Registered Successfully:', reg.scope);
          })
          .catch(function (err) {
            console.error('Service Worker Registration Failed:', err);
          });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
